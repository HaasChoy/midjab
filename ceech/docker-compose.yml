services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672" # Management UI
      - "5672:5672"   # AMQP port
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  ollama:
    image: ollama/ollama
    ports:
      - "11436:11434"
    volumes:
      - ollama_data:/root/.ollama

  db:
    image: postgres:15
    env_file: .env # Loads credentials from .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  planner:
    build: ./planner
    env_file: .env # Loads credentials from .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  judge:
    build: ./judge
    depends_on:
      rabbitmq:
        condition: service_healthy
      planner:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      - RABBITMQ_HOST=rabbitmq
      - CONSUME_QUEUE=activity_stream
      - PUBLISH_QUEUE=judged_activity_stream
      - DEAD_LETTER_QUEUE=activity_stream_dlq
      - PLANNER_API_URL=http://planner:8000/api/goals/active
      - OLLAMA_API_URL=http://ollama:11434/api/generate
    restart: unless-stopped

  observer:
    build: ./observer
    depends_on:
      rabbitmq:
        condition: service_healthy
    ipc: host
    pid: host
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.Xauthority
      - RABBITMQ_HOST=rabbitmq
      - QUEUE_NAME=activity_stream
      - IDLE_TIMEOUT_SECONDS=300
    restart: unless-stopped
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - "${XAUTHORITY}:/tmp/.Xauthority:rw"

volumes:
  ollama_data:
  postgres_data: