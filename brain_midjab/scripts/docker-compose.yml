version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: midjab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: locationenabled
      POSTGRES_DB: midjab_v3
    ports:
      - "5432:5432"
    volumes:
      - ${HOME}/midjab-db/postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d midjab_v3"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.0
    container_name: midjab_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@midjab.com
      PGADMIN_DEFAULT_PASSWORD: locationenabled
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - ${HOME}/midjab-db/pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
